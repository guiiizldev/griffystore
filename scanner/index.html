<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner Griffy Store</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scanner-shell">
      <header class="scanner-header">
        <img src="logo.png" alt="Griffy Store" />
        <div>
          <h1>Scanner</h1>
          <p>Leitura de produtos para o caixa</p>
        </div>
      </header>

      <section class="camera-panel">
        <div class="camera-frame">
          <video id="video" playsinline muted></video>
          <div class="scanner-target" aria-hidden="true"></div>
          <span class="scan-line" aria-hidden="true"></span>
          <span class="scan-glow" aria-hidden="true"></span>
          <span class="scan-feedback" aria-hidden="true">Codigo enviado</span>
          <span class="corner top-left" aria-hidden="true"></span>
          <span class="corner top-right" aria-hidden="true"></span>
          <span class="corner bottom-left" aria-hidden="true"></span>
          <span class="corner bottom-right" aria-hidden="true"></span>
        </div>
        <button id="start" type="button">Iniciar camera</button>
        <div id="status" role="status">Pronto para iniciar.</div>
      </section>

      <form class="manual-panel" id="manualForm">
        <label for="code">Codigo manual</label>
        <div class="manual-row">
          <input id="code" autocomplete="off" inputmode="text" placeholder="Digite ou cole o codigo" required />
          <button type="submit">Enviar</button>
        </div>
      </form>
    </main>
    <script src="vendor/zxing-browser.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
