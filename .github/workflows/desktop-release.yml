name: Desktop Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix store-app
      - run: npm run check
      - run: npm run test:sale-duplicates
      - run: npm run test:desktop-updates
      - run: npm run build --prefix store-app
      - name: Build installer and unpacked app
        run: npx electron-builder --win nsis dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/write-update-manifest.js
      - name: Package portable
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath "dist/Griffy-Store-Portable-$version.zip"
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag and package version differ" }
          gh release create "${{ github.ref_name }}" --draft --title "Griffy Store $version" --notes "Correcao de duplicacoes no caixa e atualizacao integrada. Instale esta versao uma vez para habilitar as proximas atualizacoes pelo aplicativo."
          gh release upload "${{ github.ref_name }}" dist/*.exe dist/*.blockmap dist/latest.yml dist/latest.json dist/*.zip
          gh release edit "${{ github.ref_name }}" --draft=false --latest
